apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  labels:
    app: locust
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:2.37.10
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - /mnt/locust/locustfile.py
            - --host=http://experiment-gpt-service:9999
          ports:
            - containerPort: 8089
              name: web
          volumeMounts:
            - name: locust-script
              mountPath: /mnt/locust
      volumes:
        - name: locust-script
          configMap:
            name: locust-script
---
apiVersion: v1
kind: Service
metadata:
  name: locust-web
spec:
  type: NodePort
  selector:
    app: locust
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
      nodePort: 30089
      name: http
